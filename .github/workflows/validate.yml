name: Validate and package plugin

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements-dev.txt
      - run: python -m pip install -r tooling/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tooling/validate_package.py

  runtime-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements-dev.txt
      - run: python -m pip install -r tooling/requirements-dev.txt
      - run: python tooling/build_runtime.py --output-dir bin/${{ matrix.target }}
      - name: Run fresh bundled runtime
        shell: bash
        run: |
          chmod +x bin/${{ matrix.target }}/wewo-qa* || true
          python tooling/smoke_runtime.py --runtime bin/${{ matrix.target }}/wewo-qa$(if [ "${{ matrix.target }}" = "windows-x64" ]; then echo .exe; fi)
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: bin/${{ matrix.target }}/
          if-no-files-found: error
      - name: Package runtime-only plugin
        run: python tooling/package_plugin.py --target ${{ matrix.target }} --output "${{ runner.temp }}/wewo-qa-skills-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.target }}
          path: ${{ runner.temp }}/wewo-qa-skills-${{ matrix.target }}.zip
          if-no-files-found: error

  release-contract:
    needs: [package, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: bin/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: bin/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: bin/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: bin/macos-x64
      - run: python tooling/validate_package.py --release
