name: Validate plugin

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - run: python -m pip install -r scripts/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_package.py

  runtime-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Run bundled runtime
        shell: bash
        run: |
          chmod +x bin/${{ matrix.target }}/wewo-qa* || true
          bin/${{ matrix.target }}/wewo-qa* --help
          bin/${{ matrix.target }}/wewo-qa* validate-test-points tests/fixtures/valid-test-points.json
