name: Build bundled runtimes

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements-dev.txt
      - run: python -m pip install -r tooling/requirements-dev.txt
      - run: python tooling/build_runtime.py --output-dir bin/${{ matrix.target }}
      - name: Smoke test bundled runtime
        shell: bash
        run: |
          chmod +x bin/${{ matrix.target }}/wewo-qa* || true
          bin/${{ matrix.target }}/wewo-qa* --help
          bin/${{ matrix.target }}/wewo-qa* validate-test-points tests/fixtures/valid-test-points.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: bin/${{ matrix.target }}/wewo-qa*
          if-no-files-found: error
